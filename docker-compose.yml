services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lanterne
      POSTGRES_PASSWORD: lanterne
      POSTGRES_DB: lanterne
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
