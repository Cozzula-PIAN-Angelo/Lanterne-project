name: CI

on:
  push:
    branches: [main, "piano-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Servizi (PostgreSQL, Mailpit, SeaweedFS)
        run: docker compose up -d --wait

      # SeaweedFS e Mailpit non hanno un healthcheck: compose li dà per pronti appena partono.
      - name: Attendi S3 e Mailpit
        run: |
          curl --retry 30 --retry-delay 2 --retry-all-errors -s -o /dev/null http://localhost:9000
          curl --retry 30 --retry-delay 2 --retry-all-errors -sf -o /dev/null http://localhost:8025/readyz

      - run: pnpm install --frozen-lockfile

      - name: Setup (.env, chiavi VAPID, bucket, migrazioni, dati demo)
        run: pnpm run setup

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:int

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Risultati dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Log dei servizi
        if: failure()
        run: docker compose logs --no-color --tail=200
