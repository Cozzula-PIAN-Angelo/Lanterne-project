<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il tuo pontile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Reenie+Beanie&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e6e3dc; --fg:#1b1f27; --muted:#4f535b; --accent:#b4472a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15171b; --fg:#ece6d6; --muted:#aaa598; --accent:#f2b562; } }
  * { box-sizing:border-box }
  html { -webkit-text-size-adjust:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 'Zen Kaku Gothic New', system-ui, sans-serif; }
  ::selection { background:#f2b56255 }
  .page { max-width:1320px; margin:0 auto; padding:28px 16px 56px }
  .intro h1 { font:700 26px/1.2 'Zen Old Mincho', Georgia, serif; margin:0 0 8px }
  .intro p { margin:0 0 10px; color:var(--muted); max-width:68ch }
  .ctrl { display:flex; gap:12px; align-items:center; margin:16px 0 6px; flex-wrap:wrap }
  .ctrl input[type=range] { width:min(460px,100%); accent-color:var(--accent) }
  .ctrl output { font-variant-numeric:tabular-nums; min-width:5ch; font-weight:500 }
  .pagebtn { font:inherit; font-size:14px; padding:5px 14px; border-radius:999px; border:1.5px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer }
  .pagebtn:focus-visible, .phone :focus-visible { outline:2px solid #f2b562; outline-offset:2px }
  .marks { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px }
  .marks .pagebtn { font-size:13px; padding:3px 11px }
  .phones { display:grid; grid-template-columns:repeat(auto-fit, 300px); gap:28px 24px; justify-content:center; margin-top:28px }
  figure { margin:0 }
  figcaption { margin-top:12px; font-size:13.5px; color:var(--muted); max-width:300px }
  figcaption b { color:var(--fg); font-weight:700 }

  /* ---- telefono ---- */
  .phone { width:300px; height:620px; border-radius:36px; border:7px solid #0d0f13; position:relative; overflow:hidden;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.45); background:var(--ground, #0b1220); color:var(--ink, #efe7da);
    --ink:#efe7da; --soft:#c4bdae; --ground:#0b1220; --sheet:rgba(255,255,255,.06); --line:rgba(239,231,218,.16);
    --btn:#f2b562; --btn-ink:#2a1408; --field:rgba(255,255,255,.08); --chip:rgba(9,14,26,.66); --chip-ink:#f4eee2; --chip-soft:#d9d1c2; --top-ink:#f4eee2; --danger:#f0a08c;
    transition:background-color .8s, color .8s }
  .phone canvas { position:absolute; left:0; top:0; width:286px; height:606px }
  .phone .shade { text-shadow:0 1px 8px rgba(0,0,0,.22) }
  :where(.phone) button { font:inherit; color:inherit; cursor:pointer }
  .ttl { font:700 26px/1.15 'Zen Old Mincho', Georgia, serif; letter-spacing:.3px; margin:0 }
  .lede { font-size:13px; line-height:1.45; margin:6px 0 0; max-width:230px }
  .top { position:absolute; left:20px; right:20px; top:22px; z-index:3; color:var(--top-ink); transition:color .8s }
  .iconbtn { position:absolute; top:16px; right:12px; width:44px; height:44px; border:0; background:transparent; display:grid; place-items:center; border-radius:50%; z-index:4; color:var(--top-ink) }
  .iconbtn svg { width:22px; height:22px }
  .back { display:inline-flex; align-items:center; gap:4px; border:0; background:none; padding:6px 0; font-size:13.5px; text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px }
  .back svg { width:14px; height:14px }

  /* home: persone sull'altra riva, scritte sull'acqua */
  .who { position:absolute; z-index:3; top:250px; height:190px; width:84px; transform:translateX(-50%); border:0; background:none; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; color:#f7f1e5; text-align:center; border-radius:14px }
  .who .nm { font:400 23px/1.1 'Zen Old Mincho', Georgia, serif; letter-spacing:.4px; text-shadow:0 1px 2px rgba(0,0,0,.55), 0 0 14px rgba(0,0,0,.45) }
  .who .st { font-size:12px; line-height:1.3; margin-top:5px; color:#ece4d4; text-wrap:balance; text-shadow:0 1px 2px rgba(0,0,0,.6), 0 0 10px rgba(0,0,0,.5) }
  .who.waiting .nm { opacity:.78 }
  .invite { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:3; display:flex; flex-direction:column; align-items:center; gap:4px;
    border:0; background:none; padding:6px 12px; border-radius:14px; color:#f7f1e5; font:400 15px/1.2 'Zen Old Mincho', Georgia, serif; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6), 0 0 12px rgba(0,0,0,.55) }
  .invite::before { content:""; width:30px; height:44px }
  #h5 .invite::before { display:none }
  #h5 .invite.tag { left:auto; right:164px; top:374px; bottom:auto; transform:rotate(4deg); transform-origin:100% 50%;
    background:linear-gradient(#f6ecda, #eadcc3); color:#3a2a1e; text-shadow:none; font:400 13.5px/1 'Zen Old Mincho', Georgia, serif;
    padding:7px 15px 7px 10px; border-radius:6px 3px 3px 6px; clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%);
    box-shadow:0 4px 10px -4px rgba(0,0,0,.55); transition:transform .4s cubic-bezier(.16,1,.3,1), background .3s; animation:tagsway 6s ease-in-out infinite }
  #h5 .invite.tag::after { content:""; position:absolute; right:8px; top:50%; width:4px; height:4px; margin-top:-2px; border-radius:50%; background:rgba(58,42,30,.55) }
  #h5 .invite.tag:hover, #h5 .invite.tag:focus-visible { background:linear-gradient(#fff6e4, #f3e2c4); transform:rotate(1deg) translateY(-1px) }
  @keyframes tagsway { 0%,100% { rotate:0deg } 50% { rotate:1.6deg } }
  @media (prefers-reduced-motion: reduce) { #h5 .invite.tag { animation:none } }
  #h5 .who { top:190px; height:66px }
  #h5 .who .nm { font-size:21px }
  /* nomi: tre proposte */
  #h5[data-names="velo"] .who .nm, #h5[data-names="alone"] .who .nm { font-size:24px }
  #h5[data-names="alone"] .who .nm, #h5[data-names="alone"] .who .st { text-shadow:-1.5px 0px 0 rgba(14,10,8,.92), 1.5px 0px 0 rgba(14,10,8,.92), 0px -1.5px 0 rgba(14,10,8,.92), 0px 1.5px 0 rgba(14,10,8,.92), -1px -1px 0 rgba(14,10,8,.92), 1px -1px 0 rgba(14,10,8,.92), -1px 1px 0 rgba(14,10,8,.92), 1px 1px 0 rgba(14,10,8,.92), 0 2px 8px rgba(0,0,0,.6) }
  #h5[data-names="alone"][data-dark="true"] .who .nm { color:#fff3dc; text-shadow:-1.5px 0px 0 rgba(14,10,8,.92), 1.5px 0px 0 rgba(14,10,8,.92), 0px -1.5px 0 rgba(14,10,8,.92), 0px 1.5px 0 rgba(14,10,8,.92), -1px -1px 0 rgba(14,10,8,.92), 1px -1px 0 rgba(14,10,8,.92), -1px 1px 0 rgba(14,10,8,.92), 1px 1px 0 rgba(14,10,8,.92), 0 0 14px rgba(255,170,80,.7), 0 0 30px rgba(255,140,50,.45) }
  #h5[data-names="cielo"] .who { top:104px; height:70px; justify-content:flex-start; color:var(--top-ink) }
  #h5[data-names="cielo"] .who .nm { font-size:25px; text-shadow:none }
  #h5[data-names="cielo"] .who .st { color:var(--top-ink); text-shadow:none; opacity:.92 }
  #h5[data-names="cielo"][data-dark="true"] .who .nm { text-shadow:0 0 12px rgba(255,236,200,.35) }
  #h5[data-names="cartelli"] .who { top:150px; height:112px; width:72px }
  #h5[data-names="cartelli"] .who:nth-child(1)::after { height:20px }
  #h5[data-names="cartelli"] .who:nth-child(2)::after { height:9px }
  #h5[data-names="cartelli"] .who:nth-child(3)::after { height:15px }
  #h5[data-names="cartelli"] .who .nm, #h5[data-names="cartelli"] .who .st { align-self:stretch; color:#f6ead4; text-shadow:0 1px 0 rgba(0,0,0,.55);
    background:repeating-linear-gradient(0deg, rgba(40,24,12,.10) 0 1px, transparent 1px 4px), linear-gradient(#80593a, #5d3f28); box-shadow:0 3px 6px -2px rgba(0,0,0,.5) }
  #h5[data-names="cartelli"] .who .nm { font-size:16px; padding:4px 5px 1px; border-radius:3px 3px 0 0 }
  #h5[data-names="cartelli"] .who .st { margin:0; padding:1px 5px 5px; font-size:10.5px; line-height:1.25; color:#efe2c8; border-radius:0 0 3px 3px }
  #h5[data-names="cartelli"] .who::after { content:""; width:3px; height:12px; background:linear-gradient(90deg,#3a271a,#5a3d28); }
  #h5[data-names="cartelli"] .who.waiting .nm, #h5[data-names="cartelli"] .who.waiting .st { background:repeating-linear-gradient(0deg, rgba(40,24,12,.08) 0 1px, transparent 1px 4px), linear-gradient(#8f7258, #6f5641); opacity:.9 }
  #h5[data-names="cartelli"][data-dark="true"] .who .nm, #h5[data-names="cartelli"][data-dark="true"] .who .st { background:repeating-linear-gradient(0deg, rgba(20,12,6,.14) 0 1px, transparent 1px 4px), linear-gradient(#5c3f2a, #3f2a1b) }
  .namebar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; font-size:14px }
  .namebar .pagebtn[aria-pressed="true"] { background:var(--fg); color:var(--bg) }
  .hand-giulia .nm { font:400 19px/1.5 'Homemade Apple', cursive; letter-spacing:0 }
  .hand-sara .nm { font:400 34px/1 'Reenie Beanie', cursive; letter-spacing:.5px }
  /* ricordi */
  .pager { display:flex; align-items:center; gap:2px; margin-top:10px }
  .pager button { width:36px; height:36px; border:0; background:none; border-radius:50%; display:grid; place-items:center }
  .pager button:disabled { opacity:.3; cursor:default }
  .pager svg { width:16px; height:16px }
  .pager span { font:700 15px 'Zen Old Mincho', Georgia, serif; min-width:12ch; text-align:center }
  .memo { position:absolute; left:16px; right:16px; top:300px; z-index:3; background:var(--chip); color:var(--chip-ink); border-radius:16px; padding:14px 16px;
    box-shadow:0 14px 28px -12px rgba(0,0,0,.6); transition:opacity .35s, transform .45s cubic-bezier(.16,1,.3,1) }
  .memo.hidden { opacity:0; transform:translateY(8px); pointer-events:none }
  .memo .k { font-size:12px; color:var(--chip-soft) }
  .memo .q { font:400 17px/1.45 'Zen Old Mincho', Georgia, serif; margin:6px 0 0 }
  .memo .row { display:flex; align-items:center; gap:12px; margin-top:10px }
  .play { width:44px; height:44px; border-radius:50%; border:0; background:#f2b562; color:#2a1408; display:grid; place-items:center; flex:none }
  .play svg { width:18px; height:18px }
  .memo canvas.thumb { position:static; width:100%; height:120px; border-radius:10px; margin-top:10px; display:block }
  .empty { position:absolute; left:24px; right:24px; top:330px; z-index:3; text-align:center; background:var(--chip); color:var(--chip-ink); border-radius:16px; padding:16px; font:400 16px/1.5 'Zen Old Mincho', Georgia, serif }
  .lant { position:absolute; z-index:3; width:36px; height:40px; transform:translate(-50%,-50%); border:0; background:transparent; border-radius:12px }

  /* pagine di servizio: seguono il cielo */
  .svc .band { position:absolute; left:0; right:0; top:0; height:176px }
  .svc .band::after { content:""; position:absolute; inset:auto 0 0 0; height:56px; background:linear-gradient(transparent, var(--ground)); transition:background .8s }
  .scroll { position:absolute; inset:168px 0 0 0; overflow:auto; padding:6px 18px 28px; z-index:3; scrollbar-width:thin; scrollbar-color:var(--line) transparent }
  .scroll h2 { font:700 17px/1.3 'Zen Old Mincho', Georgia, serif; margin:22px 0 8px }
  .scroll h2:first-child { margin-top:8px }
  .scroll p { margin:0 0 10px; font-size:13.5px; color:var(--soft) }
  .grp { border-top:1px solid var(--line) }
  .rowi { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px }
  .rowi small { display:block; color:var(--soft); font-size:12px; line-height:1.35; margin-top:2px }
  label.fld { display:block; font-size:12.5px; color:var(--soft); margin:12px 0 4px }
  .inp { width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:10px; padding:10px 12px; caret-color:#e8a75c }
  .inp:focus { outline:2px solid #e8a75c; outline-offset:1px }
  .sw { display:flex; gap:6px; flex-wrap:wrap }
  .sw button { width:24px; height:24px; border-radius:50%; border:2px solid transparent; padding:0; background:var(--c); box-shadow:inset 0 0 0 1px rgba(0,0,0,.15) }
  .sw button[aria-pressed="true"] { border-color:var(--ink) }
  .tg { appearance:none; flex:none; width:44px; height:26px; border-radius:999px; background:var(--field); border:1px solid var(--line); position:relative; cursor:pointer; transition:background .25s }
  .tg::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--soft); transition:transform .3s cubic-bezier(.16,1,.3,1), background .25s }
  .tg:checked { background:#e8a75c; border-color:#e8a75c }
  .tg:checked::after { transform:translateX(18px); background:#fff8ec }
  .primary { width:100%; border:0; border-radius:999px; padding:13px 18px; background:var(--btn); color:var(--btn-ink); font-weight:700; font-size:15px; margin-top:16px }
  .ghost { width:100%; border:1px solid var(--line); border-radius:999px; padding:11px 18px; background:transparent; font-weight:500; font-size:14.5px; margin-top:10px }
  .danger { color:var(--danger) }
  .times { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px }
  .times button { border:1px solid var(--line); background:var(--field); border-radius:10px; padding:8px 0; font-size:13.5px; font-variant-numeric:tabular-nums }
  .times button.wide { grid-column:span 4 }
  .times button[aria-pressed="true"] { background:var(--btn); color:var(--btn-ink); border-color:transparent; font-weight:700 }
  .link { display:flex; gap:8px; align-items:center; background:var(--field); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13.5px; word-break:break-all; margin-top:6px }
  [hidden] { display:none !important }
</style>
</head>
<body>
<div class="page">
  <section class="intro">
    <h1>Scaldare il lago: la via di mezzo</h1>
    <p>La stessa home, quattro idee. Il cielo e l'acqua restano veri; cambia da dove viene il calore. Fai scorrere l'ora e guarda soprattutto la sera, quando arrivano le lanterne di Giulia.</p>
    <div class="ctrl">
      <button class="pagebtn" id="play" type="button">Pausa</button>
      <input id="t" type="range" min="0" max="1439" step="1" value="1230" aria-label="Ora del giorno">
      <output id="clock" for="t">10:10</output>
    </div>
    <div class="marks">
      <button class="pagebtn" type="button" data-t="610">Mattina</button>
      <button class="pagebtn" type="button" data-t="900">Pomeriggio</button>
      <button class="pagebtn" type="button" data-t="1005">Tramonto</button>
      <button class="pagebtn" type="button" data-t="1250">Sera, prima di Giulia</button>
      <button class="pagebtn" type="button" data-t="1350">Arrivate quelle di Giulia</button>
      <button class="pagebtn" type="button" data-t="20">Dopo mezzanotte</button>
    </div>
    <div class="namebar" role="group" aria-label="Come scrivere i nomi sul telefono del pontile">
      <span>Nomi sulla riva:</span>
      <button class="pagebtn" type="button" data-names="attuale" aria-pressed="false">Attuale</button>
      <button class="pagebtn" type="button" data-names="velo" aria-pressed="true">1. Velo</button>
      <button class="pagebtn" type="button" data-names="cartelli" aria-pressed="false">2. Cartelli</button>
      <button class="pagebtn" type="button" data-names="alone" aria-pressed="false">3. Contorno</button>
      <button class="pagebtn" type="button" data-names="cielo" aria-pressed="false">4. Nel cielo</button>
    </div>
  </section>

  <div class="phones">
    <figure>
      <div class="phone" id="h5">
        <canvas id="c5" aria-hidden="true"></canvas>
        <div class="top shade"><h2 class="ttl">Le tue persone</h2><p class="lede">Ognuno sulla sua riva. Tocca una luce per raggiungerla.</p></div>
        <button class="iconbtn shade" type="button" aria-label="Impostazioni" data-ink>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="ppl"></div>
        <button class="invite tag" type="button">Invita qualcuno</button>
      </div>
      <figcaption><b>5. Il tuo pontile, col fuoco accanto.</b> La via di mezzo. Anche tu hai un pontile, gemello di quelli sull'altra riva, con una tazza che fuma; accanto, sui sassi, il falò che la sera scalda legno, ciottoli e canneti. In punta pende la tua lanterna spenta: invitare qualcuno è accenderla.</figcaption>
    </figure>
    <figure>
      <div class="phone" id="h1">
        <canvas id="c1" aria-hidden="true"></canvas>
        <div class="top shade"><h2 class="ttl">Le tue persone</h2><p class="lede">Ognuno sulla sua riva. Tocca una luce per raggiungerla.</p></div>
        <button class="iconbtn shade" type="button" aria-label="Impostazioni" data-ink>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="ppl"></div>
        <button class="invite" type="button" style="left:104px">Invita qualcuno</button>
      </div>
      <figcaption><b>1. Il falò sulla tua riva.</b> Di giorno brace e un filo di fumo, la sera un fuoco che scalda i sassi e i canneti. È il posto dove ti siedi ad ascoltare: i vocali come racconti attorno al fuoco.</figcaption>
    </figure>
    <figure>
      <div class="phone" id="h2">
        <canvas id="c2" aria-hidden="true"></canvas>
        <div class="top shade"><h2 class="ttl">Le tue persone</h2><p class="lede">Ognuno sulla sua riva. Tocca una luce per raggiungerla.</p></div>
        <button class="iconbtn shade" type="button" aria-label="Impostazioni" data-ink>

  const INV_TAG = { x: 112, y: 386 };
  function drawMyJetty2(ctx, t, T, P, B, hot) {

    const ix = h.v === 'fuoco' ? 104 : W / 2, iy = H - 62;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(ix, iy + 11, 8, 2, 0, 0, 7); ctx.fill();
    if (h.v === 'mano') tintedLantern(ctx, ix, iy, 9, h.invHot, 1, '#7D9CC0'); else paperLantern(ctx, ix, iy, 9, h.invHot, 1);
  }

  const h5 = document.getElementById('h5'); h5.dataset.names = 'velo';
  document.querySelectorAll('[data-names]').forEach(b => { if (b === h5) return; b.addEventListener('click', () => {
    h5.dataset.names = b.dataset.names; document.querySelectorAll('.namebar [data-names]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }); });

  // ---------- orologio ----------
  const slider = document.getElementById('t'), playBtn = document.getElementById('play'), clock = document.getElementById('clock');
  let t = +slider.value, playing = !reduce, last = performance.now();
  playBtn.textContent = playing ? 'Pausa' : 'Riproduci';
  function frame(now) {
    const dt = now - last; last = now;
    if (playing) { t = (t + dt / 1000 * 22) % 1440; slider.value = Math.floor(t); }
    const tt = Math.floor(t), { P, B, T } = drawBase(tt, now);
    tokens(tt, P);
    for (const h of homes) drawHome(h, tt, now, T, P, B);
    clock.textContent = hm(tt);
    requestAnimationFrame(frame);
  }
  slider.addEventListener('input', () => { t = +slider.value; });
  playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? 'Pausa' : 'Riproduci'; });
  document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { t = +b.dataset.t; slider.value = t; playing = false; playBtn.textContent = 'Riproduci'; }));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
